[package]
name = "morfius-mail"
version = "0.1.0"
description = "Почта — локальный почтовый клиент IMAP и SMTP"
authors = ["Morfius"]
edition = "2021"

[lib]
name = "morfius_mail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
imap = "2.4.1"
native-tls = "0.2"
lettre = "0.11"
mailparse = "0.16"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
roxmltree = "0.20"
sha2 = "0.10"
webbrowser = "1"
