limit_req_zone $binary_remote_addr zone=mail_oauth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name oauth.morfius.ru;

    client_max_body_size 16k;

    location = /mail/token {
        limit_req zone=mail_oauth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787/mail/token;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        return 404;
    }
}
